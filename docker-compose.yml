# docker-compose décrit et démarre plusieurs conteneurs ensemble,
# ainsi que le réseau qui leur permet de communiquer entre eux.
#
# Commandes utiles :
#   docker compose up -d --build   -> build les images et démarre les conteneurs (arrière-plan)
#   docker compose logs -f         -> suit les logs en direct
#   docker compose ps              -> liste les conteneurs et leur état
#   docker compose down            -> arrête et supprime les conteneurs
#
# Ce projet n'est PAS exposé directement à Internet : aucun port n'est
# publié ici. C'est le Caddy "gateway" partagé (voir ~/gateway sur le
# VPS, hors de ce repo — silvaplana.cloud héberge plusieurs applis sous
# des chemins différents, voir DEPLOY.md) qui possède le domaine/le
# HTTPS et route /contretemps/* vers le service "frontend" ci-dessous,
# via le réseau Docker externe "web".
#
# Sur le VPS, ce réseau doit exister avant le premier `docker compose up`
# (déjà créé une fois pour les autres applis, voir DEPLOY.md) :
#   docker network create web

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Pas de variable requise pour l'instant (voir backend/.env.example) :
    # le fichier peut ne pas exister, "env_file" ne râle pas dans ce cas.
    env_file:
      - path: ./backend/.env
        required: false
    # Fichier SQLite + fichiers vidéo (voir backend/Dockerfile :
    # DATABASE_URL/VIDEOS_DIR/VIDEOS_REFERENCE_DIR pointent tous dans ce
    # dossier, qui appartient à appuser) — volume nommé pour que tout ça
    # survive à un `docker compose up -d --build` (sinon perdu à chaque
    # redéploiement, le système de fichiers du conteneur n'étant pas
    # persistant par défaut).
    volumes:
      - backend_data:/app/data
    # "expose" (contrairement à "ports") ne rend PAS le port accessible
    # depuis l'extérieur de la machine : seul le conteneur "frontend"
    # peut y accéder, via le réseau interne que docker-compose crée
    # automatiquement pour ce projet.
    expose:
      - "8000"

  # Relance automatique des messages non lus (voir spec/SPEC.md §5.5 et
  # backend/src/app/relance_worker.py) — même image que "backend", même
  # volume (pour lire/écrire la même base SQLite), juste une commande
  # différente. Processus à part plutôt qu'une tâche de fond dans
  # "backend" : ne se mélange jamais avec le cycle de vie de l'app FastAPI
  # (tests compris — voir le commentaire en tête de relance_worker.py).
  messagerie-relance:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend_data:/app/data
    # "-u" (non bufferisé) : sinon les print() de relance_worker.py
    # n'apparaissent jamais dans `docker compose logs` (stdout mis en
    # tampon par défaut dès qu'il n'est pas un vrai terminal, comme ici).
    command: ["python", "-u", "-m", "app.relance_worker"]

  frontend:
    build:
      context: ./frontend
      args:
        # L'app appelle son API sur son propre chemin (/contretemps/api/...),
        # que le gateway route vers ici puis que le Caddy interne (voir
        # frontend/Caddyfile) transmet à "backend". Voir aussi le "base" dans
        # vite.config.js, qui doit rester cohérent avec ce chemin.
        VITE_API_URL: /contretemps/api
    restart: unless-stopped
    container_name: contretemps-frontend
    # Réseau par défaut du projet (communication avec "backend") + réseau
    # "web" partagé avec le gateway, qui doit pouvoir joindre ce conteneur
    # par son nom ("contretemps-frontend", voir container_name ci-dessus).
    networks:
      - default
      - web
    depends_on:
      - backend

  # Page publique d'inscription (voir spec/SPEC-inscription.md et
  # frontend-inscription/) — appli sœur séparée, même patron que
  # "frontend" ci-dessus, mais sert /contretemps-inscription/* et parle
  # au MÊME backend (voir frontend-inscription/Caddyfile : proxy /api/*
  # vers "backend", réseau "default" partagé).
  frontend-inscription:
    build:
      context: ./frontend-inscription
      args:
        VITE_API_URL: /contretemps-inscription/api
    restart: unless-stopped
    container_name: contretemps-inscription-frontend
    networks:
      - default
      - web
    depends_on:
      - backend

networks:
  default:
  web:
    external: true

volumes:
  backend_data:
