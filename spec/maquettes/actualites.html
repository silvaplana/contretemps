<title>Maquette Actualités</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Maquette du module Actualités (fil « Module : Actualités », 2026-11-06), à valider par Seb avant la spec. Ouvrir dans un navigateur : tout est cliquable. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
/* Layout : à gauche le téléphone (cliquable, aux couleurs de Contretemps), à droite les notes de l'écran affiché. */
:root {
  --page: #f3eee8; --ink: #2a2118; --muted: #6e6152; --line: #ddd2c4; --panel: #fbf8f4; --note-accent: #b5521a;
  --display: 'Archivo', system-ui, sans-serif;
  --narrow: 'Archivo Narrow', 'Archivo', system-ui, sans-serif;
  --body: system-ui, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #191612; --ink: #efe8e0; --muted: #a99c8c; --line: #352e26; --panel: #221e19; --note-accent: #f0955a; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #191612; --ink: #efe8e0; --muted: #a99c8c; --line: #352e26; --panel: #221e19; --note-accent: #f0955a; color-scheme: dark }

body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; line-height: 1.1; margin: 0 0 6px; text-wrap: balance; }
.intro { color: var(--muted); max-width: 62ch; margin: 0 0 18px; line-height: 1.5; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 22px; font-size: 14px; }
.controls span { color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: var(--panel); color: var(--ink); padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
.seg button:focus-visible { outline: 2px solid var(--note-accent); outline-offset: -2px; }
.grid { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 36px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.notes { min-width: 0; }
.notes h2 { font-family: var(--display); font-size: 1.15rem; margin: 0 0 10px; }
.notes p, .notes li { line-height: 1.55; max-width: 62ch; }
.notes ul { padding-left: 1.1em; margin: 0 0 14px; }
.notes .eyebrow { font-family: var(--narrow); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--note-accent); margin: 0 0 4px; }
.notes .ask { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 18px; color: var(--muted); font-size: 14px; }

/* ---- Téléphone : charte Contretemps (frontend/src/index.css), un seul thème comme l'appli ---- */
.phone {
  --bg: #fdecd8; --card: #fffaf1; --border: #e8c08c; --text: #3a2410; --muted: #8a6a4a;
  --accent: #d8722a; --accent-bg: rgba(216,114,42,.14); --contrast: #fffaf1; --dark: #2b1a0c;
  width: 100%; max-width: 390px; height: 780px; margin: 0 auto; border-radius: 34px; border: 10px solid #1a120a;
  background: var(--bg); color: var(--text); position: relative; overflow: hidden;
  display: flex; flex-direction: column; font-size: 17px; line-height: 1.45; box-shadow: 0 18px 40px rgba(0,0,0,.18);
}
.phone button { font: inherit; color: inherit; }
.phone :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
.top .logo { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--contrast); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; flex: none; }
.top strong { font-family: var(--display); font-size: 19px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 48px; height: 48px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
.body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.body > * { flex-shrink: 0; }

.news { padding: 16px 16px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.news .head { display: flex; align-items: center; gap: 6px; }
.news .who { color: var(--muted); font-size: 15px; flex: 1; }
.news .who b { color: var(--text); font-weight: 600; }
.news .head .icon-btn { margin: -10px -10px -10px 0; }
.news p { margin: 0; white-space: pre-line; }
.news .photo { border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; max-width: 100%; }
.news .photo svg { display: block; width: 100%; height: 100%; }
.news .file { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); text-align: left; cursor: pointer; }
.news .file svg { width: 26px; height: 26px; color: #c0392b; flex: none; }
.news.new { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-bg); } }
.empty { padding: 60px 24px; text-align: center; color: var(--muted); }

.mainbar { padding: 10px 16px; border-top: 1px solid var(--border); background: var(--bg); }
.btn { min-height: 52px; border-radius: 12px; border: 0; cursor: pointer; font-weight: 700; font-size: 17px; padding: 0 18px; width: 100%; }
.btn.main { background: var(--accent); color: var(--contrast); }
.btn.main:disabled { opacity: .4; cursor: default; }
.btn.second { background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.second svg { width: 22px; height: 22px; }

.compose { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.compose textarea { font: inherit; font-size: 17px; min-height: 170px; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--card); color: var(--text); }
.compose .row { display: flex; gap: 10px; } .compose .row > * { flex: 1; }
.attached { display: flex; align-items: center; gap: 10px; }
.attached .thumb { width: 84px; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; flex: none; }
.attached .thumb svg { width: 100%; height: 100%; display: block; }
.attached span { flex: 1; color: var(--muted); font-size: 15px; }

.nav { display: flex; border-top: 1px solid var(--border); background: var(--bg); padding: 4px 4px 8px; }
.nav button { flex: 1; min-height: 52px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }

.menu-back { position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 5; display: flex; align-items: flex-end; }
.sheet { width: 100%; background: var(--card); border-radius: 18px 18px 0 0; padding: 8px 0 14px; }
.sheet button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 0 20px; border: 0; background: none; text-align: left; cursor: pointer; font-size: 17px; }
.sheet button svg { width: 22px; height: 22px; }
.sheet .danger { color: #8f2f2f; }

.toast { position: absolute; left: 12px; right: 12px; bottom: 76px; background: var(--dark); color: var(--contrast); border-radius: 12px; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; z-index: 6; min-height: 52px; }
.toast span { flex: 1; }
.toast button { border: 0; background: none; color: #ffb27a; font-weight: 700; min-height: 44px; padding: 0 12px; cursor: pointer; }
.toast i { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #ffb27a; transform-origin: left; animation: count 10s linear forwards; }
@keyframes count { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .toast i, .news.new { animation: none; } }
</style>

<div class="wrap">
  <h1>Actualités</h1>
  <p class="intro">Maquette cliquable du module Actualités de Contretemps. Barre du bas › <b>Actualités</b>, le premier onglet, ouvert à chaque lancement de l'appli. Les textes sont des exemples.</p>
  <div class="controls">
    <span>Vu par</span>
    <div class="seg" role="group" aria-label="Qui regarde">
      <button id="who-eleve" aria-pressed="false">Un élève</button>
      <button id="who-pub" aria-pressed="true">Quelqu'un qui publie</button>
    </div>
    <span>Liste</span>
    <div class="seg" role="group" aria-label="Contenu de la liste">
      <button id="list-full" aria-pressed="true">Remplie</button>
      <button id="list-empty" aria-pressed="false">Vide</button>
    </div>
  </div>

  <div class="grid">
    <div class="phone" id="phone" aria-label="Téléphone"></div>
    <div class="notes" id="notes" aria-live="polite"></div>
  </div>
</div>

<script>
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
  chore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  msg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></svg>',
  docs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
}
// Photo d'exemple dessinée : une scène, des projecteurs.
const SCENE = '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><rect width="400" height="300" fill="#3b1f10"/><path d="M80 0 L20 300 H180 Z" fill="#f6c27a" opacity=".35"/><path d="M320 0 L220 300 H380 Z" fill="#f6c27a" opacity=".3"/><rect y="230" width="400" height="70" fill="#7a3d18"/><g fill="#1d0f06"><circle cx="150" cy="150" r="14"/><path d="M150 164 l-18 50 h10 l8-24 8 24 h10z M136 175 l-30-20 M164 175 l30-25" stroke="#1d0f06" stroke-width="8" stroke-linecap="round"/><circle cx="250" cy="146" r="14"/><path d="M250 160 l-16 54 h10 l6-22 8 22 h10z M236 172 l-26 18 M264 170 l28-26" stroke="#1d0f06" stroke-width="8" stroke-linecap="round"/></g></svg>'

const EXEMPLES = [
  { id: 3, who: 'Seb', date: '6 novembre', text: "Pas de cours mardi 11 novembre (jour férié). Les cours reprennent normalement mercredi.", photo: false },
  { id: 2, who: 'Claire', date: '2 novembre', text: "Gala de fin d'année le samedi 13 juin. Les costumes seront présentés en cours la semaine prochaine.", photo: true },
  { id: 1, who: 'Seb', date: '28 octobre', text: "Stage de salsa le dimanche 23 novembre, de 14 h à 17 h. Tout est dans le document ci-dessous.", file: 'Stage salsa novembre.pdf' },
]

const S = { role: 'pub', screen: 'liste', items: EXEMPLES.slice(), menuFor: null, toast: null, draft: '', draftPhoto: false, editing: null, justAdded: null }
const phone = document.getElementById('phone'), notes = document.getElementById('notes')
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function nav() {
  const tabs = S.role === 'pub'
    ? [['news', 'Actualités'], ['admin', 'Admin'], ['chore', 'Chorés'], ['msg', 'Messages'], ['docs', 'Docs'], ['more', 'Plus']]
    : [['news', 'Actualités'], ['chore', 'Chorés'], ['msg', 'Messages'], ['docs', 'Docs'], ['user', 'Profil']]
  return '<nav class="nav">' + tabs.map(([k, l], i) => `<button ${i === 0 ? 'aria-current="page"' : ''} data-act="noop">${I[k]}${l}</button>`).join('') + '</nav>'
}

function liste() {
  const pub = S.role === 'pub'
  const items = S.items.length ? S.items.map((n) => `
    <article class="news ${S.justAdded === n.id ? 'new' : ''}">
      <div class="head"><span class="who"><b>${esc(n.who)}</b> · ${n.date}</span>
        ${pub ? `<button class="icon-btn" aria-label="Plus d'actions" data-act="menu" data-id="${n.id}">${I.dots}</button>` : ''}</div>
      <p>${esc(n.text)}</p>
      ${n.photo ? `<div class="photo">${SCENE}</div>` : ''}
      ${n.file ? `<button class="file" data-act="noop">${I.file}<span>${esc(n.file)}</span></button>` : ''}
    </article>`).join('') : `<div class="empty">Pas encore d'actualité.</div>`
  return `<header class="top"><span class="logo">CT</span><strong>Contretemps</strong></header>
    <div class="body">${items}</div>
    ${pub ? `<div class="mainbar"><button class="btn main" data-act="new">Publier une actualité</button></div>` : ''}
    ${nav()}
    ${S.menuFor ? `<div class="menu-back" data-act="close"><div class="sheet" role="menu">
      <button role="menuitem" data-act="edit">${I.edit}Modifier</button>
      <button role="menuitem" class="danger" data-act="del">${I.trash}Supprimer</button></div></div>` : ''}
    ${toast()}`
}

function compose() {
  const title = S.editing ? "Modifier l'actualité" : 'Nouvelle actualité'
  return `<header class="top"><button class="icon-btn" aria-label="Retour" data-act="cancel">${I.back}</button><strong>${title}</strong></header>
    <div class="body"><div class="compose">
      <textarea id="draft" aria-label="Texte de l'actualité" placeholder="Écrivez l'actualité…">${esc(S.draft)}</textarea>
      ${S.draftPhoto
        ? `<div class="attached"><div class="thumb">${SCENE}</div><span>Photo ajoutée</span><button class="icon-btn" aria-label="Retirer la photo" data-act="unphoto">${I.trash}</button></div>`
        : `<div class="row"><button class="btn second" data-act="photo">${I.photo}Photo</button><button class="btn second" data-act="noop">${I.file}Document</button></div>`}
    </div></div>
    <div class="mainbar"><button class="btn main" id="publish" data-act="publish" ${S.draft.trim() ? '' : 'disabled'}>${S.editing ? 'Enregistrer' : 'Publier'}</button></div>
    ${nav()}`
}

function toast() {
  if (!S.toast) return ''
  return `<div class="toast" role="status"><span>${S.toast}</span><button data-act="undo">Annuler</button><i></i></div>`
}

const NOTES = {
  liste: () => S.role === 'pub' ? `
    <p class="eyebrow">Actualités</p><h2>La liste, pour quelqu'un qui publie</h2>
    <ul>
      <li>Le droit 🔒 « Publier les actualités » (Admin › École › Administrateurs) fait apparaître le bouton <b>Publier une actualité</b> en bas, et un <b>⋯</b> sur chaque actualité (Modifier, Supprimer).</li>
      <li>Tout le monde voit les mêmes actualités, de la plus récente à la plus ancienne. Pas de titre, pas d'encadré : un texte, et au besoin une photo ou un document de Docs.</li>
      <li>Sous chaque actualité : qui l'a publiée et le jour, sans heure.</li>
      <li>Supprimer : l'actualité disparaît tout de suite, « Annuler » pendant 10 s.</li>
    </ul>${ASK}` : `
    <p class="eyebrow">Actualités</p><h2>La liste, pour un élève</h2>
    <ul>
      <li>L'appli s'ouvre toujours ici, pour tout le monde (élèves, profs, bureau). Avant, elle s'ouvrait sur le dernier onglet utilisé.</li>
      <li>Lecture seule : pas de bouton, pas de ⋯. Un document s'ouvre comme dans Docs (PDF dans la visionneuse du téléphone).</li>
      <li>Les anciennes actualités restent en dessous ; on fait défiler.</li>
    </ul>${ASK}`,
  compose: () => `
    <p class="eyebrow">Actualités › Publier une actualité</p><h2>${S.editing ? "Modifier l'actualité" : 'Nouvelle actualité'}</h2>
    <ul>
      <li>Un seul champ de texte, puis au choix une <b>Photo</b> (galerie ou appareil photo) ou un <b>Document</b> pris dans Docs.</li>
      <li>Un seul bouton principal : <b>${S.editing ? 'Enregistrer' : 'Publier'}</b>, grisé tant que le texte est vide. ← revient à la liste sans rien publier.</li>
      <li>Essayez : écrivez quelques mots, ajoutez la photo, publiez.</li>
    </ul>${ASK}`,
}
const ASK = `<p class="ask"><b>Une question :</b> une nouvelle actualité envoie-t-elle une notification sur le téléphone de tout le monde ? Recommandation : oui, c'est ce qui fait qu'on la voit.</p>`

function render() {
  phone.innerHTML = S.screen === 'liste' ? liste() : compose()
  notes.innerHTML = NOTES[S.screen]()
  const ta = document.getElementById('draft')
  if (ta) ta.addEventListener('input', () => { S.draft = ta.value; document.getElementById('publish').disabled = !S.draft.trim() })
  document.getElementById('who-eleve').setAttribute('aria-pressed', S.role === 'eleve')
  document.getElementById('who-pub').setAttribute('aria-pressed', S.role === 'pub')
  document.getElementById('list-full').setAttribute('aria-pressed', S.items.length > 0)
  document.getElementById('list-empty').setAttribute('aria-pressed', S.items.length === 0)
}

let timer = null, undoFn = null
function showToast(text, undo) {
  clearTimeout(timer); S.toast = text; undoFn = undo
  timer = setTimeout(() => { S.toast = null; undoFn = null; S.justAdded = null; render() }, 10000)
}

phone.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return
  const act = b.dataset.act
  if (act === 'close' && e.target !== b) return
  if (act === 'menu') S.menuFor = +b.dataset.id
  if (act === 'close') S.menuFor = null
  if (act === 'new') { S.screen = 'compose'; S.draft = ''; S.draftPhoto = false; S.editing = null; S.toast = null }
  if (act === 'cancel') S.screen = 'liste'
  if (act === 'photo') S.draftPhoto = true
  if (act === 'unphoto') S.draftPhoto = false
  if (act === 'edit') {
    const n = S.items.find((x) => x.id === S.menuFor)
    Object.assign(S, { screen: 'compose', editing: n.id, draft: n.text, draftPhoto: !!n.photo, menuFor: null })
  }
  if (act === 'del') {
    const idx = S.items.findIndex((x) => x.id === S.menuFor), [gone] = S.items.splice(idx, 1)
    S.menuFor = null
    showToast('Actualité supprimée', () => S.items.splice(idx, 0, gone))
  }
  if (act === 'publish') {
    if (S.editing) {
      Object.assign(S.items.find((x) => x.id === S.editing), { text: S.draft, photo: S.draftPhoto })
      S.justAdded = S.editing; S.toast = null
    } else {
      const id = Date.now()
      S.items.unshift({ id, who: 'Seb', date: '6 novembre', text: S.draft, photo: S.draftPhoto })
      S.justAdded = id
      showToast('Actualité publiée', () => { S.items = S.items.filter((x) => x.id !== id) })
    }
    S.screen = 'liste'; S.editing = null
  }
  if (act === 'undo') { clearTimeout(timer); undoFn && undoFn(); S.toast = null; undoFn = null }
  render()
})

document.getElementById('who-eleve').onclick = () => { Object.assign(S, { role: 'eleve', screen: 'liste', menuFor: null }); render() }
document.getElementById('who-pub').onclick = () => { S.role = 'pub'; render() }
document.getElementById('list-full').onclick = () => { S.items = EXEMPLES.slice(); S.screen = 'liste'; render() }
document.getElementById('list-empty').onclick = () => { S.items = []; S.screen = 'liste'; render() }
render()
</script>
