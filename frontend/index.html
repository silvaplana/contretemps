<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% (substitué par Vite, voir vite.config.js) plutôt qu'un
         chemin "/en dur : sous le build web, l'app est servie sous
         /contretemps/ (voir le commentaire sur `base` dans vite.config.js) —
         un chemin racine casserait ces icônes une fois déployées. -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#F46E19" />
    <!-- viewport-fit=cover : permet a env(safe-area-inset-*) (voir index.css)
         de tenir compte de l'encoche/la barre de geste sur mobile. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Contretemps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
