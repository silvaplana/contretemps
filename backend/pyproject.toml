[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contretemps-backend"
version = "0.1.0"
description = "API REST FastAPI pour Contretemps (gestion d'ecole de danse)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy>=2.0",
    "alembic",
    # Pilote PostgreSQL (prod, voir spec/SPEC.md section 1) — le code SQLAlchemy
    # reste portable, le dev local peut tourner sur SQLite (DATABASE_URL, voir
    # .env.example) sans ce pilote.
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
app = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
