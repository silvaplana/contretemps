[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contretemps-backend"
version = "0.1.0"
description = "API REST FastAPI pour Contretemps (gestion d'ecole de danse)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy>=2.0",
    "alembic",
    # Pilote PostgreSQL (prod, voir spec/SPEC.md section 1) — le code SQLAlchemy
    # reste portable, le dev local peut tourner sur SQLite (DATABASE_URL, voir
    # .env.example) sans ce pilote.
    "psycopg2-binary",
    # Lecture des fichiers .xlsx pour l'import Excel des élèves (§6.4bis).
    "openpyxl",
    # Binaire ffmpeg embarqué (pas de dépendance système) — sert à lire la
    # durée d'un fichier vidéo (voir videos/duree.py, utilisé par le seed
    # de démo et par le panneau "Usage vidéo", Admin > École).
    "imageio-ffmpeg",
    # Notifications push (Web Push, voir notifications/) — chiffrement +
    # signature VAPID des messages envoyés aux serveurs de push
    # (FCM/Mozilla/...), voir .env.example.
    "pywebpush",
    # Les 2 PDF d'inscription (dossier + facture, voir
    # inscriptions/dossier_html.py et facture_html.py) sont générés en
    # HTML/CSS + Chromium headless (gabarits fournis par l'utilisateur,
    # bien plus proches de vrais documents qu'un rendu par primitives de
    # dessin) — Chromium installé via apt dans le Dockerfile, pas une
    # dépendance Python.
    # Appels à l'API HelloAsso (paiement en ligne, voir
    # inscriptions/helloasso.py) — déjà installé transitivement (via
    # pywebpush), déclaré explicitement puisqu'on l'utilise directement.
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
app = "app.main:main"
reset-demo = "app.reset_demo:main"

[tool.setuptools.packages.find]
where = ["src"]

# Gabarits HTML + images (logo/signature) du dossier et de la facture
# (voir inscriptions/dossier_html.py, facture_html.py) — pas du code
# Python, setuptools ne les embarque pas par défaut dans le paquet
# installé (contrairement au dossier source, où ils sont juste là).
# Sans cette ligne, `pip install .` (voir Dockerfile) produirait une
# image où la génération de PDF échoue (fichier introuvable), jamais en
# dev local (qui tourne depuis les sources, pas depuis le paquet
# installé).
[tool.setuptools.package-data]
inscriptions = ["facture_template/*", "dossier_template/*"]
