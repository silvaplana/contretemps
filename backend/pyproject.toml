[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contretemps-backend"
version = "0.1.0"
description = "API REST FastAPI pour Contretemps (gestion d'ecole de danse)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
app = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
