# Construit l'appli Android de la caméra de la salle (dossier recorder/,
# spec/modules/video-combats.md §11 « Caméra de la salle »).
#
# Sur une PR : vérifie que l'appli se construit, l'APK est dans les
# « Artifacts » de l'exécution. Sur main : l'APK est publié dans la release
# « camera-latest », à une adresse fixe à ouvrir sur le téléphone :
# https://github.com/silvaplana/contretemps/releases/download/camera-latest/fights-camera.apk
name: Appli caméra (APK)

on:
  push:
    branches: [main]
    paths: ["recorder/**", ".github/workflows/recorder-apk.yml"]
  pull_request:
    paths: ["recorder/**", ".github/workflows/recorder-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà sur les machines ubuntu-latest (ANDROID_HOME) ;
      # Gradle y ajoute seul la plateforme qui manque.
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk fights-camera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fights-camera
          path: recorder/fights-camera.apk

      - name: Publier (release camera-latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view camera-latest >/dev/null 2>&1 || \
            gh release create camera-latest --title "Appli caméra de la salle" \
              --notes "Appli Android du téléphone qui filme la salle (Fights). Ouvrir le lien fights-camera.apk sur le téléphone pour l'installer ou la mettre à jour."
          gh release upload camera-latest fights-camera.apk --clobber
