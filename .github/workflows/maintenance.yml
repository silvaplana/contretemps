# Maintenance du VPS à la demande (voir DEPLOY.md §6).
#
# Onglet Actions du dépôt > « Maintenance du VPS » > Run workflow : on
# choisit une tâche dans une liste fermée. GitHub se connecte au VPS avec la
# même clé que le déploiement ; sur le VPS, cette clé ne peut lancer que
# deploy.sh, qui reconnaît ces tâches et refuse tout le reste.
name: Maintenance du VPS

on:
  workflow_dispatch:
    inputs:
      tache:
        description: Que faire ?
        type: choice
        required: true
        options:
          - Lister les écoles et leurs notes de frais
          - Effacer les notes de frais d'une école
      ecole:
        description: Numéro de l'école (pour effacer ; donné par « Lister »)
        required: false
        default: ""
      nom:
        description: Nom exact de l'école, en confirmation (pour effacer)
        required: false
        default: ""

# Jamais pendant un déploiement.
concurrency:
  group: deploiement-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      TACHE: ${{ inputs.tache }}
      ECOLE: ${{ inputs.ecole }}
      NOM: ${{ inputs.nom }}
    steps:
      - name: Préparer la demande
        id: demande
        run: |
          case "$TACHE" in
            "Lister les écoles et leurs notes de frais")
              echo "commande=notes-frais-lister" >> "$GITHUB_OUTPUT" ;;
            "Effacer les notes de frais d'une école")
              if ! [[ "$ECOLE" =~ ^[0-9]+$ ]] || [ -z "$NOM" ]; then
                echo "::error::Pour effacer, donnez le numéro de l'école et son nom exact."
                exit 1
              fi
              echo "commande=notes-frais-vider $ECOLE $(printf '%s' "$NOM" | base64 -w0)" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Tâche inconnue."
              exit 1 ;;
          esac

      - name: Préparer la clé SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Lancer la tâche sur le VPS
        env:
          COMMANDE: ${{ steps.demande.outputs.commande }}
        run: |
          ssh -i ~/.ssh/deploy -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "$COMMANDE"

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deploy
